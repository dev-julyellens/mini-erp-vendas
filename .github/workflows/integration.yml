name: Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  integration:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mini_erp_vendas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mini_erp_vendas_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_pgsql, json, mbstring, gd
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Prepare database
        env:
          PGPASSWORD: postgres
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_NAME: mini_erp_vendas_test
          DB_USER: postgres
          DB_PASSWORD: postgres
          APP_DEBUG: 'true'
          JWT_SECRET: ci-test-jwt-secret-minimum-32-chars-long
        run: |
          psql -h 127.0.0.1 -U postgres -d mini_erp_vendas_test -f database/database.sql
          php database/run_migration.php

      - name: Run integration tests
        run: composer test:integration
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_NAME: mini_erp_vendas_test
          DB_USER: postgres
          DB_PASSWORD: postgres
          APP_DEBUG: 'true'
          JWT_SECRET: ci-test-jwt-secret-minimum-32-chars-long
